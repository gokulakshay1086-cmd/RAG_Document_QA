version: "3.9"

services:
  backend:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  frontend:
    build: .
    container_name: rag-frontend
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - RAG_API_URL=http://backend:8000
    depends_on:
      - backend
